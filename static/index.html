<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOSPITAL QUALITY OS</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></div>
      <div><b>HOSPITAL<br>QUALITY OS</b><small>Software QMS</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><b id="sf-team">TEAM 2</b><span id="sf-proj">Hospital Management Software QMS</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="iconbtn menu" id="menu" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" placeholder="Search requirements, tests, defects, reviews, CAPA, documents..." autocomplete="off">
        <div class="dropdown" id="gresults" hidden></div>
      </div>
      <div class="top-right">
        <div class="projchip" id="projchip"></div>
        <button class="iconbtn" id="bell" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg><span class="dot" id="bellcount" hidden>0</span></button>
        <div class="dropdown" id="bellmenu" hidden style="right:56px;width:400px;top:50px"></div>
        <div class="user" id="user"><div class="avatar" id="avatar">Q</div><div><small id="urole">Role</small><b id="uname">User</b></div></div>
        <div class="dropdown" id="usermenu" hidden style="right:0;width:280px;top:50px"></div>
      </div>
    </header>
    <main class="content" id="view"><div class="loading">Loading...</div></main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="/static/vendor/chart.umd.js"></script>
<script src="/static/app.js"></script>
<script src="/static/modules.js"></script>
<script src="/static/pages.js"></script>
<script>boot();</script>
</body>
</html>
